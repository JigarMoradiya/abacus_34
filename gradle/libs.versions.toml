# Billing & Data
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
revenuecat = { group = "com.revenuecat.purchases", name = "purchases", version.ref = "revenuecat" }
revenuecat-ui = { group = "com.revenuecat.purchases", name = "purchases-ui", version.ref = "revenuecat" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
javaluator = { group = "com.fathzer", name = "javaluator", version.ref = "javaluator" }
commons-text = { group = "org.apache.commons", name = "commons-text", version.ref = "commonsText" }

# UI components
scrolling-pager-indicator = { group = "ru.tinkoff.scrollingpagerindicator", name = "scrollingpagerindicator", version.ref = "scrollingPageIndicator" }
viewpager-transformers = { group = "com.eftimoff", name = "android-viewpager-transformers", version.ref = "viewpagerTransformers" }
range-seekbar = { group = "com.github.MohammedAlaaMorsi", name = "RangeSeekBar", version.ref = "rangeSeekBar" }
ccp = { group = "com.hbb20", name = "ccp", version.ref = "ccp" }
simple-rating-bar = { group = "com.github.ome450901", name = "SimpleRatingBar", version.ref = "simpleRatingBar" }
eventbus = { group = "org.greenrobot", name = "eventbus", version.ref = "eventbus" }
imagepicker = { group = "com.github.dhaval2404", name = "imagepicker", version.ref = "imagepicker" }
accompanist-flowlayout = { group = "com.google.accompanist", name = "accompanist-flowlayout", version.ref = "accompanist" }

# Misc
onesignal = { group = "com.onesignal", name = "OneSignal", version.ref = "onesignal" }
install-referrer = { group = "com.android.installreferrer", name = "installreferrer", version.ref = "installReferrer" }
kotlin-parcelize-runtime = { group = "org.jetbrains.kotlin", name = "kotlin-parcelize-runtime", version.ref = "kotlin" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
