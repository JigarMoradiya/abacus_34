navigation = "2.9.6"
hilt = "2.57.2"
hiltAndroidx = "1.3.0"

# AndroidX
appcompat = "1.7.1"
material = "1.13.0"
constraintlayout = "2.2.1"
swiperefreshlayout = "1.1.0"
lifecycle = "2.9.4"
room = "2.8.3"
sqlite = "2.6.1"
work = "2.11.0"
credentials = "1.5.0"
activityCompose = "1.9.3"
media3 = "1.9.0"
composeBom = "2025.12.01"

# Firebase
firebaseBom = "34.5.0"
firebaseDatabase = "21.0.0"
firebaseConfig = "22.1.2"
firebaseMessaging = "24.1.2"
firebaseAuth = "23.2.1"
firebaseCore = "21.1.1"

# Google
playServicesAuth = "21.4.0"
googleid = "1.1.1"
assetDelivery = "2.3.0"
playReview = "2.0.2"

# Networking
retrofit = "3.0.0"
okhttp = "5.3.0"
rxjava2 = "2.2.21"
rxandroid = "2.1.1"
rxbinding3 = "3.1.0"

# Image loading
glide = "5.0.5"
coil = "2.7.0"

# Data
sqlcipher = "4.11.0"
gson = "2.13.2"
billing = "8.1.0"
revenuecat = "8.12.2"

# UI libraries
scrollingPageIndicator = "1.2.5"
viewpagerTransformers = "1.0.1"
commonsText = "1.14.0"
rangeSeekBar = "1.0.6"
ccp = "2.7.3"
simpleRatingBar = "1.5.1"
eventbus = "3.3.1"
imagepicker = "2.1"
accompanist = "0.36.0"

# Misc
javaluator = "3.0.6"
onesignal = "5.4.0"
installReferrer = "2.2"

# Testing
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
# AndroidX core
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }

# Navigation
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Lifecycle
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-common-java8 = { group = "androidx.lifecycle", name = "lifecycle-common-java8", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Room
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
